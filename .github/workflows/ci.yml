name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Same checks as the Obsidian community directory review: eslint-plugin-obsidianmd on
      # src/, package.json and manifest.json, CSS lint, versions and a reproducible build.
      - run: npm run lint
      - run: npm run check-release
