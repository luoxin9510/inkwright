name: Claude review

# An independent review of every pull request by Claude, posted as PR comments.
# Needs the Claude GitHub App installed on the repo and a CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an independent reviewer for this pull request. You did not write it; do not trust
            its description, check the code. Read CLAUDE.md first: it has the project's rules.

            Look for, in this order:
            1. Bugs: wrong behaviour, unhandled errors, broken saves/state, races between recompiles.
            2. Rule breaks from CLAUDE.md: Node/Electron APIs in src/ (must run on mobile), user-visible
               text not going through T() with both zh and en, pure logic changed without tests.
            3. Obsidian review guidelines: no innerHTML, Vault API over the adapter, no default hotkeys,
               APIs newer than manifest.json minAppVersion.
            4. Only then: clear simplifications. Skip style nits.

            Post specific problems as inline comments (mcp__github_inline_comment__create_inline_comment),
            then one summary comment with `gh pr comment` that says whether you would merge as is.
            Be brief; say nothing about things that are fine.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
